---
# roles/unifi_os_server/defaults/main.yml

# UniFi OS Server release to install, and its installer from Ubiquiti. Change all three together: the version, URL
# and SHA-256 of a release come from Ubiquiti's firmware API (README.md, "Upgrading"). The role installs this version
# when the host has none or an older one, and leaves a newer one alone (an update made from the UniFi OS UI).
unifi_os_server_version: "5.1.42"
unifi_os_server_installer_url: >-
  https://fw-download.ubnt.com/data/unifi-os-server/5172-linux-x64-5.1.42-12e9e3cf-8f8b-4e54-928c-76b80a10c8a4.42-x64
unifi_os_server_installer_sha256: f6111e9396a42c74016f5dde9b01fbef486a6fe69efe137935e6e38b7c22f94d

# Port of the web UI (UniFi OS's 443 inside its container). Passed to the installer, which saves it in
# /var/lib/uosserver/server.conf, so it takes effect when the role installs or upgrades.
unifi_os_server_web_port: 11443

# Packages the installer needs: Podman (it runs UniFi OS as a rootless Podman container under the user uosserver),
# rootless networking (passt provides pasta, the installer's default; slirp4netns is the alternative) and user
# namespaces.
unifi_os_server_packages:
  - podman
  - uidmap
  - passt
  - slirp4netns
  - iptables
  - ca-certificates

# Where the installer (about 800 MB) is downloaded to. It's deleted after a successful install.
unifi_os_server_download_dir: /var/cache/unifi-os-server

# How long to wait for the web UI to answer after installing or starting, in seconds. The first start takes a few
# minutes (MongoDB, the Network application).
unifi_os_server_wait_timeout: 900
